# Blueprint opcional: "New Blueprint Instance" no Render apontando para este repositório.
# Ajuste região/plano e defina no dashboard (ou via secrets) DATABASE_URL, JWT_SECRET e CORS_ORIGIN.

services:
  - type: web
    name: futpro-api
    runtime: node
    plan: free
    region: oregon
    # Deve ser exatamente "backend" (pasta na raiz do repo). NÃO use "src/backend".
    rootDir: backend
    # --include=dev garante @nestjs/cli e prisma no build se NODE_ENV=production estiver definido.
    buildCommand: npm install --include=dev && rm -rf dist tsconfig.build.tsbuildinfo && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "20"
