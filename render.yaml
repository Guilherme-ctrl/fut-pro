# Blueprint opcional: "New Blueprint Instance" no Render apontando para este repositório.
# Ajuste região/plano e defina no dashboard (ou via secrets) DATABASE_URL, JWT_SECRET e CORS_ORIGIN.

services:
  - type: web
    name: personal-futebol-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "20"
